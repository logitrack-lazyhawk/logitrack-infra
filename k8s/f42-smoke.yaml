
apiVersion: v1
kind: ConfigMap
metadata:
  name: f42-common
data:
  SPRING_PROFILES_ACTIVE: "dev"
  CONFIG_SERVER_URL: "http://configserver:8085"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8065/eureka/"
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx220m -XX:ActiveProcessorCount=2"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
  RABBITMQ_LISTENER_AUTO_STARTUP: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.0
          args:
            - --performance-schema=OFF
            - --innodb-buffer-pool-size=64M
            - --max-connections=40
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: f42-secrets
                  key: mysql-password
            - name: MYSQL_DATABASE
              value: shipment_db
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.4.0-management-alpine
          ports:
            - containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: f42
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: f42-secrets
                  key: rabbit-password
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configserver
  template:
    metadata:
      labels:
        app: configserver
    spec:
      containers:
        - name: configserver
          image: luism46/configserver:latest
          ports:
            - containerPort: 8085
          env:
            - name: GIT_CONFIG_URI
              value: "https://github.com/logitrack-lazyhawk/configserver-ms.git"
            - name: SPRING_PROFILES_ACTIVE
              value: git
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx220m -XX:ActiveProcessorCount=2"
            - name: TRACING_SAMPLING_PROBABILITY
              value: "0.0"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: 160Mi
              cpu: 100m
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: configserver
spec:
  selector:
    app: configserver
  ports:
    - port: 8085
      targetPort: 8085

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: luism46/eureka-server:latest
          ports:
            - containerPort: 8065
          envFrom:
            - configMapRef:
                name: f42-common
          env:
            - name: SERVER_PORT
              value: "8065"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: eureka-server
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8065
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests:
              memory: 160Mi
              cpu: 100m
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8065
      targetPort: 8065

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: courier-service
  template:
    metadata:
      labels:
        app: courier-service
    spec:
      containers:
        - name: courier-service
          image: luism46/courier-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: f42-common
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: courier_db
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: f42-secrets
                  key: mysql-password
            - name: JPA_DDL_AUTO
              value: update
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: f42
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: f42-secrets
                  key: rabbit-password
            - name: SHOW_SQL
              value: "false"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 35
            periodSeconds: 10
          resources:
            requests:
              memory: 160Mi
              cpu: 100m
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: courier-service
spec:
  selector:
    app: courier-service
  ports:
    - port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipment-service
  template:
    metadata:
      labels:
        app: shipment-service
    spec:
      containers:
        - name: shipment-service
          image: luism46/shipment-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: f42-common
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: shipment_db
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: f42-secrets
                  key: mysql-password
            - name: JPA_DDL_AUTO
              value: update
            - name: COURIER_SERVICE_URL
              value: http://courier-service:8081
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: f42
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: f42-secrets
                  key: rabbit-password
            - name: SHOW_SQL
              value: "false"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 10
          resources:
            requests:
              memory: 160Mi
              cpu: 100m
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: shipment-service
spec:
  selector:
    app: shipment-service
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: luism46/api-gateway:latest
          ports:
            - containerPort: 8066
          envFrom:
            - configMapRef:
                name: f42-common
          env:
            - name: SERVER_PORT
              value: "8066"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8066
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 160Mi
              cpu: 100m
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8066
      targetPort: 8066
  type: ClusterIP
