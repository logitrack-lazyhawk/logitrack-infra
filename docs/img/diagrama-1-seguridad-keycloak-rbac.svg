<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-keycloak" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
    
    <!-- Marcadores de flechas -->
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#fbbf24"/>
    </marker>

    <!-- Gradientes -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Encabezado del diagrama -->
  <rect x="0" y="0" width="1100" height="70" fill="#1e293b"/>
  <rect x="0" y="68" width="1100" height="2" fill="url(#header-grad)"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#f8fafc">ARQUITECTURA DE SEGURIDAD &amp; RBAC — SPRINT 4</text>
  <text x="650" y="42" font-size="14" font-weight="500" fill="#94a3b8">Autenticación OIDC, Keycloak (RS256) y Route Guards</text>

  <!-- ================= ZONA 1: FRONTEND (CLIENTE) ================= -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="280" height="480" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="42" rx="12" fill="#334155"/>
    <text x="20" y="27" font-size="14" font-weight="700" fill="#f8fafc">🖥️ FRONTEND (Vite + React)</text>
    <text x="200" y="26" font-size="11" font-weight="600" fill="#38bdf8">:5173</text>

    <!-- Login & AuthContext -->
    <rect x="15" y="60" width="250" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" font-size="13" font-weight="700" fill="#38bdf8">AuthContext &amp; Session</text>
    <text x="25" y="105" font-size="11" fill="#cbd5e1">• Parseo del token JWT de Keycloak</text>
    <text x="25" y="125" font-size="11" fill="#cbd5e1">• Extrae roles: <tspan fill="#f59e0b" font-weight="bold">ADMIN</tspan>, <tspan fill="#10b981" font-weight="bold">CLIENTE</tspan></text>
    <text x="25" y="145" font-size="11" fill="#cbd5e1">• Eventos: storage y logitrack:sesion</text>

    <!-- RBAC UI Guards -->
    <rect x="15" y="190" width="250" height="265" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="215" font-size="13" font-weight="700" fill="#34d399">ProtectedRoute &amp; Layout RBAC</text>
    
    <!-- Admin Box -->
    <rect x="25" y="230" width="230" height="95" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="35" y="250" font-size="12" font-weight="700" fill="#f59e0b">🛡️ Rol ADMIN (Backoffice)</text>
    <text x="35" y="270" font-size="11" fill="#94a3b8">• /envios (Control global)</text>
    <text x="35" y="290" font-size="11" fill="#94a3b8">• /repartidores (Gestión de flota)</text>
    <text x="35" y="310" font-size="11" fill="#94a3b8">• /clientes, /comercio</text>

    <!-- Cliente Box -->
    <rect x="25" y="340" width="230" height="100" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="360" font-size="12" font-weight="700" fill="#10b981">📦 Rol CLIENTE (Portal)</text>
    <text x="35" y="380" font-size="11" fill="#94a3b8">• /mis-envios (Historial propio)</text>
    <text x="35" y="400" font-size="11" fill="#94a3b8">• /crear-envio (Autogestión)</text>
    <text x="35" y="420" font-size="11" fill="#94a3b8">• /productos, /carrito (Catálogo)</text>
  </g>

  <!-- ================= ZONA 2: API GATEWAY ================= -->
  <g transform="translate(390, 100)">
    <rect x="0" y="0" width="290" height="480" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="290" height="42" rx="12" fill="#4338ca"/>
    <text x="20" y="27" font-size="14" font-weight="700" fill="#ffffff">🚪 API GATEWAY (Spring Cloud)</text>
    <text x="235" y="26" font-size="11" font-weight="600" fill="#a5b4fc">:8066</text>

    <!-- Funciones Gateway -->
    <rect x="15" y="60" width="260" height="85" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
    <text x="25" y="85" font-size="12" font-weight="700" fill="#a5b4fc">Filtro Perimetral de Seguridad</text>
    <text x="25" y="105" font-size="11" fill="#cbd5e1">• Single Point of Entry (CORS global)</text>
    <text x="25" y="125" font-size="11" fill="#cbd5e1">• Reenvío de Bearer Authorization Header</text>

    <!-- Endpoint /api/auth/me -->
    <rect x="15" y="160" width="260" height="120" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
    <text x="25" y="185" font-size="12" font-weight="700" fill="#38bdf8">GET /api/auth/me (RegistroController)</text>
    <text x="25" y="205" font-size="11" fill="#cbd5e1">• Decodifica JWT firmado por Keycloak</text>
    <text x="25" y="225" font-size="11" fill="#cbd5e1">• Responde { id, email, rol, nombre }</text>
    <text x="25" y="245" font-size="11" fill="#cbd5e1">• Sincroniza sesión inicial de la SPA</text>
    <text x="25" y="265" font-size="10" fill="#a78bfa">⚡ Integración directa con Keycloak OIDC</text>

    <!-- Enrutamiento dinámico -->
    <rect x="15" y="295" width="260" height="160" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
    <text x="25" y="320" font-size="12" font-weight="700" fill="#34d399">Dynamic Routing (lb:// via Eureka)</text>
    <text x="25" y="345" font-size="11" fill="#94a3b8">/api/v1/envios/** ➔ lb://SHIPMENT-SERVICE</text>
    <text x="25" y="370" font-size="11" fill="#94a3b8">/api/v1/repartidores/** ➔ lb://COURIER-SERVICE</text>
    <text x="25" y="395" font-size="11" fill="#94a3b8">/api/v1/productos/** ➔ lb://COMMERCE-SERVICE</text>
    <text x="25" y="420" font-size="11" fill="#94a3b8">/realms/lazyhawk/** ➔ http://keycloak:8080</text>
  </g>

  <!-- ================= ZONA 3: KEYCLOAK (IdP) ================= -->
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="310" height="230" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#glow-keycloak)"/>
    <rect x="0" y="0" width="310" height="42" rx="12" fill="#0369a1"/>
    <text x="20" y="27" font-size="14" font-weight="700" fill="#ffffff">🔐 KEYCLOAK 24.0.1 (OIDC IdP)</text>
    <text x="255" y="26" font-size="11" font-weight="600" fill="#7dd3fc">:8082</text>

    <rect x="15" y="55" width="280" height="160" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="25" y="78" font-size="13" font-weight="700" fill="#38bdf8">Realm: "lazyhawk"</text>
    <text x="25" y="98" font-size="11" fill="#cbd5e1">• Criptografía: <tspan fill="#facc15" font-weight="bold">RS256 (Clave Privada)</tspan></text>
    <text x="25" y="118" font-size="11" fill="#cbd5e1">• Emite: JWT con claims en realm_access</text>
    <text x="25" y="138" font-size="11" fill="#cbd5e1">• Roles: ADMIN, CLIENTE, REPARTIDOR</text>
    <text x="25" y="158" font-size="11" fill="#cbd5e1">• Endpoint JWKS: Clave Pública para verificar</text>
    <text x="25" y="180" font-size="10" fill="#34d399">✓ Aislamiento completo de inquilinos</text>
  </g>

  <!-- ================= ZONA 4: MICROSERVICIOS BACKEND ================= -->
  <g transform="translate(750, 350)">
    <rect x="0" y="0" width="310" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="310" height="42" rx="12" fill="#334155"/>
    <text x="20" y="27" font-size="14" font-weight="700" fill="#f8fafc">⚙️ MICROSERVICIOS BACKEND</text>

    <rect x="15" y="55" width="280" height="160" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="78" font-size="12" font-weight="700" fill="#34d399">Validación Local con Clave Pública</text>
    <text x="25" y="100" font-size="11" fill="#cbd5e1">• <tspan fill="#38bdf8">shipment-service (:8080)</tspan> - Valida firma RS256</text>
    <text x="25" y="120" font-size="11" fill="#cbd5e1">• <tspan fill="#38bdf8">commerce-service (:8084)</tspan> - Endpoints protegidos</text>
    <text x="25" y="140" font-size="11" fill="#cbd5e1">• <tspan fill="#38bdf8">courier-service (:8081)</tspan> - Flota y asignación</text>
    <text x="25" y="165" font-size="11" fill="#f59e0b">🔒 No conocen la clave privada (Seguridad Zero-Trust)</text>
    <text x="25" y="185" font-size="10" fill="#94a3b8">Extraen contexto y 'sub' directamente del token</text>
  </g>

  <!-- ================= FLECHAS DE FLUJO ================= -->
  <!-- 1. Frontend a Gateway -->
  <path d="M 320 200 L 385 200" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <text x="325" y="190" font-size="10" font-weight="600" fill="#38bdf8">1. Login /api/auth</text>

  <!-- 2. Gateway a Keycloak -->
  <path d="M 680 200 L 745 200" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="682" y="190" font-size="10" font-weight="600" fill="#fbbf24">2. Valida credenciales</text>

  <!-- 3. Keycloak emite JWT a Gateway/Frontend -->
  <path d="M 745 220 L 680 220" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-emerald)"/>
  <text x="682" y="235" font-size="10" font-weight="600" fill="#34d399">3. Token JWT (RS256)</text>

  <!-- 4. Gateway a Microservicios con Bearer Token -->
  <path d="M 535 480 L 535 520 L 745 520" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text x="560" y="512" font-size="10" font-weight="600" fill="#a78bfa">4. Petición protegida + Bearer Token</text>
</svg>
