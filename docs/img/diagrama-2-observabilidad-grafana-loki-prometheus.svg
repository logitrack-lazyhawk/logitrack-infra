<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow-obs" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-grafana" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f97316" flood-opacity="0.3"/>
    </filter>

    <!-- Marcadores de flechas -->
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald-obs" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#c084fc"/>
    </marker>

    <linearGradient id="header-grad-obs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Encabezado -->
  <rect x="0" y="0" width="1100" height="70" fill="#1e293b"/>
  <rect x="0" y="68" width="1100" height="2" fill="url(#header-grad-obs)"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#f8fafc">PLATAFORMA DE OBSERVABILIDAD UNIFICADA — ÉPICA 10</text>
  <text x="690" y="42" font-size="14" font-weight="500" fill="#94a3b8">Métricas, Logs, Trazas y Correlación Log-to-Trace</text>

  <!-- ================= COLUMNA 1: FUENTES (MICROSERVICIOS DOCKER) ================= -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="260" height="480" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow-obs)"/>
    <rect x="0" y="0" width="260" height="42" rx="12" fill="#334155"/>
    <text x="20" y="27" font-size="14" font-weight="700" fill="#f8fafc">📦 FUENTES DE TELEMETRÍA</text>

    <!-- Microservicio Card -->
    <rect x="15" y="60" width="230" height="115" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="82" font-size="12" font-weight="700" fill="#38bdf8">Microservicios Spring Boot</text>
    <text x="25" y="102" font-size="11" fill="#cbd5e1">• api-gateway (:8066)</text>
    <text x="25" y="120" font-size="11" fill="#cbd5e1">• shipment-service (:8080)</text>
    <text x="25" y="138" font-size="11" fill="#cbd5e1">• commerce-service (:8084)</text>
    <text x="25" y="156" font-size="11" fill="#cbd5e1">• courier-service (:8081)</text>

    <!-- Exposición de Métricas -->
    <rect x="15" y="190" width="230" height="100" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="25" y="212" font-size="12" font-weight="700" fill="#facc15">1. Métricas Actuator</text>
    <text x="25" y="232" font-size="11" fill="#cbd5e1">• GET /actuator/prometheus</text>
    <text x="25" y="250" font-size="11" fill="#cbd5e1">• micrometer-registry-prometheus</text>
    <text x="25" y="268" font-size="11" fill="#cbd5e1">• JVM, HikariCP, HTTP Latency</text>

    <!-- Logs & Trazas -->
    <rect x="15" y="305" width="230" height="155" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="25" y="327" font-size="12" font-weight="700" fill="#c084fc">2. Logs &amp; Distributed Tracing</text>
    <text x="25" y="347" font-size="11" fill="#cbd5e1">• Formato Logback con traceId:</text>
    <text x="25" y="367" font-size="10" fill="#94a3b8" font-family="monospace">[%X{traceId},%X{spanId}]</text>
    <text x="25" y="390" font-size="11" fill="#cbd5e1">• Salida estándar: stdout/stderr</text>
    <text x="25" y="410" font-size="11" fill="#cbd5e1">• Envío de spans HTTP:</text>
    <text x="25" y="430" font-size="10" fill="#94a3b8">http://zipkin-server:9411/api/v2/spans</text>
  </g>

  <!-- ================= COLUMNA 2: RECOLECTORES Y TSDB / LOKI ================= -->
  <!-- Prometheus -->
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="310" height="145" rx="12" fill="#1e293b" stroke="#eab308" stroke-width="1.5" filter="url(#shadow-obs)"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="#854d0e"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#ffffff">🔥 PROMETHEUS v2.54.1 (Métricas)</text>
    <text x="260" y="25" font-size="11" font-weight="600" fill="#fef08a">:9090</text>

    <text x="20" y="62" font-size="11" fill="#cbd5e1">• <tspan fill="#facc15" font-weight="bold">Modelo Pull / Scraping cada 15s</tspan></text>
    <text x="20" y="80" font-size="11" fill="#cbd5e1">• Targets: Todos los microservicios UP</text>
    <text x="20" y="98" font-size="11" fill="#cbd5e1">• Almacena: Series Temporales (TSDB)</text>
    <text x="20" y="118" font-size="10" fill="#34d399">✓ health: up, up{job="commerce-service"} = 1</text>
  </g>

  <!-- Promtail & Loki -->
  <g transform="translate(360, 260)">
    <rect x="0" y="0" width="310" height="155" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow-obs)"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="#0369a1"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#ffffff">📑 LOKI 3.2.0 + PROMTAIL (Logs)</text>
    <text x="260" y="25" font-size="11" font-weight="600" fill="#bae6fd">:3100</text>

    <text x="20" y="60" font-size="11" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">Promtail:</tspan> Captura logs Docker en tiempo real</text>
    <text x="20" y="80" font-size="11" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">Loki:</tspan> Indexa etiquetas ({container_name=...})</text>
    <text x="20" y="100" font-size="11" fill="#cbd5e1">• Ultraligero: No indexa el texto completo</text>
    <text x="20" y="120" font-size="11" fill="#cbd5e1">• Consultas de alta velocidad con <tspan fill="#facc15" font-weight="bold">LogQL</tspan></text>
  </g>

  <!-- Zipkin -->
  <g transform="translate(360, 430)">
    <rect x="0" y="0" width="310" height="150" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow-obs)"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="#7e22ce"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#ffffff">🔍 OPENZIPKIN (Trazas Distribuidas)</text>
    <text x="260" y="25" font-size="11" font-weight="600" fill="#e9d5ff">:9411</text>

    <text x="20" y="60" font-size="11" fill="#cbd5e1">• Rastreo de llamadas inter-servicio</text>
    <text x="20" y="80" font-size="11" fill="#cbd5e1">• Propagación de cabeceras B3 / W3C Trace</text>
    <text x="20" y="100" font-size="11" fill="#cbd5e1">• Mide latencias por tramo (Spans)</text>
    <text x="20" y="120" font-size="10" fill="#c084fc">Detector de cuellos de botella y fallas HTTP</text>
  </g>

  <!-- ================= COLUMNA 3: GRAFANA (CONSOLA UNIFICADA) ================= -->
  <g transform="translate(730, 100)">
    <rect x="0" y="0" width="330" height="480" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="2" filter="url(#glow-grafana)"/>
    <rect x="0" y="0" width="330" height="42" rx="12" fill="#c2410c"/>
    <text x="20" y="27" font-size="14" font-weight="700" fill="#ffffff">📊 GRAFANA 11.3.0 (Visualización)</text>
    <text x="275" y="26" font-size="11" font-weight="600" fill="#ffedd5">:3000</text>

    <!-- Dashboard 1: Métricas -->
    <rect x="15" y="60" width="300" height="120" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1"/>
    <text x="25" y="82" font-size="12" font-weight="700" fill="#fb923c">Dashboard: Salud &amp; Rendimiento</text>
    <text x="25" y="102" font-size="11" fill="#cbd5e1">• Panel de Estado UP / DOWN en vivo</text>
    <text x="25" y="120" font-size="11" fill="#cbd5e1">• Memoria Heap JVM y consumo CPU</text>
    <text x="25" y="138" font-size="11" fill="#cbd5e1">• Conexiones activas HikariCP</text>
    <text x="25" y="156" font-size="11" fill="#cbd5e1">• Tasas de error HTTP 4xx / 5xx</text>

    <!-- Dashboard 2: Logs -->
    <rect x="15" y="195" width="300" height="110" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="25" y="217" font-size="12" font-weight="700" fill="#38bdf8">Dashboard: Logs Centralizados</text>
    <text x="25" y="237" font-size="11" fill="#cbd5e1">• Explorador LogQL con filtros</text>
    <text x="25" y="255" font-size="11" fill="#cbd5e1">• Filtro dinámico por contenedor</text>
    <text x="25" y="273" font-size="11" fill="#cbd5e1">• Búsqueda rápida de stacktraces</text>

    <!-- Correlación Log-to-Trace -->
    <rect x="15" y="320" width="300" height="140" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="25" y="342" font-size="12" font-weight="700" fill="#c084fc">✨ Correlación Log-to-Trace (Feature Clave)</text>
    <text x="25" y="364" font-size="11" fill="#cbd5e1">• Grafana detecta el <tspan fill="#facc15" font-weight="bold">traceId</tspan> en el log de Loki</text>
    <text x="25" y="384" font-size="11" fill="#cbd5e1">• Genera un enlace directo a Zipkin</text>
    <text x="25" y="404" font-size="11" fill="#34d399">• Con un solo clic: del error en el log</text>
    <text x="25" y="422" font-size="11" fill="#34d399">  a la traza gráfica distribuida en Zipkin</text>
    <text x="25" y="442" font-size="10" fill="#94a3b8">Cero búsquedas manuales entre herramientas</text>
  </g>

  <!-- ================= CONEXIONES Y FLECHAS ================= -->
  <!-- 1. Scraping Pull Prometheus -->
  <path d="M 360 160 L 275 160" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="285" y="152" font-size="10" fill="#eab308">Scrape HTTP :8084</text>

  <!-- 2. Prometheus a Grafana -->
  <path d="M 670 170 L 730 170" fill="none" stroke="#eab308" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="672" y="160" font-size="10" fill="#eab308">PromQL</text>

  <!-- 3. Logs de Docker a Promtail/Loki -->
  <path d="M 270 330 L 360 330" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="285" y="322" font-size="10" fill="#38bdf8">stdout logs</text>

  <!-- 4. Loki a Grafana -->
  <path d="M 670 340 L 730 340" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="675" y="332" font-size="10" fill="#38bdf8">LogQL</text>

  <!-- 5. Spans a Zipkin -->
  <path d="M 270 470 L 360 470" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="285" y="462" font-size="10" fill="#c084fc">POST spans</text>

  <!-- 6. Correlación Grafana -> Zipkin -->
  <path d="M 730 460 L 670 460" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-purple)"/>
  <text x="672" y="475" font-size="10" fill="#c084fc">Log-to-Trace</text>
</svg>
