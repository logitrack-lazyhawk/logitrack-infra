# ==============================================================================
# LOGITRACK - APROVISIONAMIENTO DE DASHBOARDS EN GRAFANA (Épica 10)
# Carga automática de dashboards JSON
# ==============================================================================

apiVersion: 1

providers:
  - name: 'LogiTrack Dashboards'
    orgId: 1
    folder: 'LogiTrack'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards

