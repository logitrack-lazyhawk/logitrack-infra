# ==============================================================================
# LOGITRACK - ORQUESTACIÓN DE ECOSISTEMA (Sprint 4 - DAAS)
# MySQL + Zipkin + Config Server + Eureka + Microservicios + Keycloak + RabbitMQ
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. BASE DE DATOS MYSQL UNIFICADA
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.4.0
    container_name: logitrack-mysql
    restart: unless-stopped
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=64M
      --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shipment_db
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    networks:
      logitrack-network:
        aliases:
          - mysql-shipment
          - mysql-courier
          - mysql-security
          - mysql-commerce
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. SERVIDOR DE TRAZABILIDAD DISTRIBUIDA (Zipkin)
  # ----------------------------------------------------------------------------
  zipkin-server:
    image: openzipkin/zipkin:latest
    container_name: logitrack-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      logitrack-network:
        aliases:
          - zipkin-server

  # ----------------------------------------------------------------------------
  # 3. SERVIDOR DE CONFIGURACIÓN CENTRALIZADA (Spring Cloud Config Server)
  # ----------------------------------------------------------------------------
  configserver:
    build:
      context: ../config-server
      dockerfile: Dockerfile
    image: luism46/configserver:latest
    container_name: logitrack-configserver
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      GIT_CONFIG_URI: https://github.com/logitrack-lazyhawk/configserver-ms.git
      SPRING_PROFILES_ACTIVE: git
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 4. SERVIDOR DE DESCUBRIMIENTO EUREKA (Spring Cloud Eureka Server)
  # ----------------------------------------------------------------------------
  eureka-server:
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    image: luism46/eureka-server:latest
    container_name: logitrack-eureka-server
    restart: unless-stopped
    ports:
      - "8065:8065"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8085
      ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    depends_on:
      - configserver
      - zipkin-server
    networks:
      logitrack-network:
        aliases:
          - eureka-server

  # ----------------------------------------------------------------------------
  # 5. MICROSERVICIO DE SEGURIDAD Y AUTENTICACIÓN (Puerto 8083)
  # ----------------------------------------------------------------------------
  security-service:
    build:
      context: ../security-service
      dockerfile: Dockerfile
    image: luism46/security-service:latest
    container_name: logitrack-security-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://configserver:8085
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
      DB_HOST: mysql-security
      DB_PORT: 3306
      DB_NAME: security_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SECURITY_DB_USER: root
      SECURITY_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JPA_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8065/eureka/
      ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin-server:
        condition: service_started
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 6. MICROSERVICIO DE REPARTIDORES (Puerto 8081)
  # ----------------------------------------------------------------------------
  courier-service:
    build:
      context: ../courier-service
      dockerfile: Dockerfile
    image: luism46/courier-service:latest
    container_name: logitrack-courier-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://configserver:8085
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
      DB_HOST: mysql-courier
      DB_PORT: 3306
      DB_NAME: courier_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JPA_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8065/eureka/
      ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_LISTENER_AUTO_STARTUP: "true"
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 7. MICROSERVICIO DE ENVÍOS (Puerto 8080)
  # ----------------------------------------------------------------------------
  shipment-service:
    build:
      context: ../shipment-service
      dockerfile: Dockerfile
    image: luism46/shipment-service:latest
    container_name: logitrack-shipment-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://configserver:8085
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
      DB_HOST: mysql-shipment
      DB_PORT: 3306
      DB_NAME: shipment_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      COURIER_SERVICE_URL: http://courier-service:8081
      JPA_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8065/eureka/
      ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_LISTENER_AUTO_STARTUP: "true"
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
      courier-service:
        condition: service_started
      zipkin-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 8. API GATEWAY CENTRALIZADO (Puerto 8066)
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    image: luism46/api-gateway:latest
    container_name: logitrack-api-gateway
    restart: unless-stopped
    ports:
      - "8066:8066"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://configserver:8085
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8065/eureka/
      ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    depends_on:
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
      security-service:
        condition: service_started
      courier-service:
        condition: service_started
      shipment-service:
        condition: service_started
      zipkin-server:
        condition: service_started
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 9. KEYCLOAK (Gestión de Identidad y Acceso) - F01 / F02 / F31
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: logitrack-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/lazyhawk HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep 'HTTP/1.1 200' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      logitrack-network:
        aliases:
          - keycloak

  # ----------------------------------------------------------------------------
  # 10. RABBITMQ (Mensajería Asíncrona) - F31
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    container_name: logitrack-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Definir RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Definir RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 11. MICROSERVICIO DE COMERCIO (Puerto 8084) - F17
  # ----------------------------------------------------------------------------
  commerce-service:
    build:
      context: ../commerce-service
      dockerfile: Dockerfile
    image: luism46/commerce-service:latest
    container_name: logitrack-commerce-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://configserver:8085
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
      DB_HOST: mysql-commerce
      DB_PORT: 3306
      DB_NAME: commerce_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JPA_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8065/eureka/
      ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin-server:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin-server:
        condition: service_started
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 12. PROMETHEUS (Recolección de Métricas) - Épica 10
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: logitrack-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
    networks:
      logitrack-network:
        aliases:
          - prometheus

  # ----------------------------------------------------------------------------
  # 13. GRAFANA LOKI (Ingesta e Indexación de Logs) - Épica 10
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.0
    container_name: logitrack-loki
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      logitrack-network:
        aliases:
          - loki

  # ----------------------------------------------------------------------------
  # 14. PROMTAIL (Recolector de Logs de Contenedores) - Épica 10
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.2.0
    container_name: logitrack-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 15. GRAFANA (Visualización y Monitoreo Unificado) - Épica 10
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: logitrack-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - zipkin-server
    networks:
      logitrack-network:
        aliases:
          - grafana

# ------------------------------------------------------------------------------
# REDES Y VOLÚMENES PERSISTENTES
# ------------------------------------------------------------------------------
networks:
  logitrack-network:
    name: logitrack-network
    driver: bridge

volumes:
  mysql_data:
    name: logitrack-mysql-data
  rabbitmq_data:
    name: logitrack-rabbitmq-data
  prometheus_data:
    name: logitrack-prometheus-data
  loki_data:
    name: logitrack-loki-data
  grafana_data:
    name: logitrack-grafana-data