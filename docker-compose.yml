# ==============================================================================
# LOGITRACK - ORQUESTACIÓN DE ECOSISTEMA (Sprint 3 - DAAS)
# Orquestación con Docker Compose: MySQL + Config Server + Eureka + Microservicios
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. BASE DE DATOS MYSQL UNIFICADA
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.4.0
    container_name: logitrack-mysql
    restart: unless-stopped
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=64M
      --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shipment_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    networks:
      logitrack-network:
        aliases:
          - mysql-shipment
          - mysql-courier
          - mysql-security
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. SERVIDOR DE CONFIGURACIÓN CENTRALIZADA (Spring Cloud Config Server)
  # ----------------------------------------------------------------------------
  configserver:
    build:
      context: ../config-server
      dockerfile: Dockerfile
    image: luism46/configserver:latest
    container_name: logitrack-configserver
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      GIT_CONFIG_URI: https://github.com/logitrack-lazyhawk/configserver-ms.git
      SPRING_PROFILES_ACTIVE: git
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 3. SERVIDOR DE DESCUBRIMIENTO EUREKA (Spring Cloud Eureka Server)
  # ----------------------------------------------------------------------------
  eureka-server:
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    image: luism46/eureka-server:latest
    container_name: logitrack-eureka-server
    restart: unless-stopped
    ports:
      - "8065:8065"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8085
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    depends_on:
      - configserver
    networks:
      logitrack-network:
        aliases:
          - eureka-server

  # ----------------------------------------------------------------------------
  # 4. MICROSERVICIO DE SEGURIDAD Y AUTENTICACIÓN (Puerto 8083)
  # ----------------------------------------------------------------------------
  security-service:
    build:
      context: ./security-service
      dockerfile: Dockerfile
    image: luism46/security-service:latest
    container_name: logitrack-security-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://configserver:8085
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
      DB_HOST: mysql-security
      DB_PORT: 3306
      DB_NAME: security_db
      DB_USER: root
      DB_PASSWORD: root
      SECURITY_DB_USER: root
      SECURITY_DB_PASSWORD: root
      JPA_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8065/eureka/
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 5. MICROSERVICIO DE REPARTIDORES (Puerto 8081)
  # ----------------------------------------------------------------------------
  courier-service:
    build:
      context: ./courier-service
      dockerfile: Dockerfile
    image: luism46/courier-service:latest
    container_name: logitrack-courier-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://configserver:8085
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
      DB_HOST: mysql-courier
      DB_PORT: 3306
      DB_NAME: courier_db
      DB_USER: root
      DB_PASSWORD: root
      JPA_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8065/eureka/
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - logitrack-network

  # ----------------------------------------------------------------------------
  # 6. MICROSERVICIO DE ENVÍOS (Puerto 8080)
  # ----------------------------------------------------------------------------
  shipment-service:
    build:
      context: ./shipment-service
      dockerfile: Dockerfile
    image: luism46/shipment-service:latest
    container_name: logitrack-shipment-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://configserver:8085
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085"
      DB_HOST: mysql-shipment
      DB_PORT: 3306
      DB_NAME: shipment_db
      DB_USER: root
      DB_PASSWORD: root
      COURIER_SERVICE_URL: http://courier-service:8081
      JPA_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8065/eureka/
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseContainerSupport"
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
      courier-service:
        condition: service_started
    networks:
      - logitrack-network

# ------------------------------------------------------------------------------
# REDES Y VOLÚMENES PERSISTENTES
# ------------------------------------------------------------------------------
networks:
  logitrack-network:
    name: logitrack-network
    driver: bridge

volumes:
  mysql_data:
    name: logitrack-mysql-data